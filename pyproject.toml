[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minigpt-lab"
version = "0.1.0"
description = "A from-scratch GPT-style language model training and evaluation lab."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "numpy>=1.26"
]

[project.optional-dependencies]
hf = ["transformers>=4.40", "accelerate>=0.29"]
dev = ["pytest>=8.0", "ruff>=0.4", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["minigpt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
